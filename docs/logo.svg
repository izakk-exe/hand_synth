<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="palmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a9c"/>
      <stop offset="1" stop-color="#9c7cff"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#44e0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#44e0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="#0a0a10"/>
  <circle cx="128" cy="128" r="100" fill="url(#aura)"/>
  <!-- stylized palm: 5 fingers + palm body as organic rounded shapes -->
  <g fill="url(#palmGrad)" stroke="#fff" stroke-width="2" stroke-linejoin="round">
    <!-- palm body -->
    <path d="M 90 170 Q 85 140 95 115 Q 105 95 128 95 Q 151 95 161 115 Q 171 140 166 170 Q 160 195 128 198 Q 96 195 90 170 Z"/>
    <!-- 5 fingertips as dots above the palm with lines (energy lines) -->
  </g>
  <!-- fingertip orbs with white glow -->
  <g>
    <circle cx="78"  cy="80" r="9" fill="#fff" stroke="#fff" stroke-width="2"/>
    <circle cx="102" cy="56" r="9" fill="#fff" stroke="#fff" stroke-width="2"/>
    <circle cx="128" cy="48" r="9" fill="#fff" stroke="#fff" stroke-width="2"/>
    <circle cx="154" cy="56" r="9" fill="#fff" stroke="#fff" stroke-width="2"/>
    <circle cx="178" cy="80" r="9" fill="#fff" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- energy lines from fingertips to palm -->
  <g stroke="#fff" stroke-width="1.5" fill="none" opacity="0.75">
    <path d="M 78 80 Q 90 110 100 125"/>
    <path d="M 102 56 Q 112 90 118 120"/>
    <path d="M 128 48 Q 128 90 128 120"/>
    <path d="M 154 56 Q 144 90 138 120"/>
    <path d="M 178 80 Q 166 110 156 125"/>
  </g>
  <!-- rising wave/sound ribbon -->
  <path d="M 60 215 Q 85 195 110 215 Q 135 235 160 215 Q 185 195 210 215"
        fill="none" stroke="#9cff6b" stroke-width="3" stroke-linecap="round"/>
</svg>
