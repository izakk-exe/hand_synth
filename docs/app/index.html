<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#06070b" />
<title>Palma — 1Z4K</title>
<link rel="manifest" href="./manifest.json" />
<style>
  :root{
    --bg:#06070b;
    --ink:#f4f4f6;
    --dim:#8a8c99;
    --line:rgba(255,255,255,.08);
    --panel:rgba(14,14,20,.78);
    --hot:#ff2d7a;
    --cold:#44e0ff;
    --warm:#ffd166;
    --lime:#9cff6b;
    --violet:#c689ff;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
    --tap:48px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#000;color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;user-select:none;touch-action:none}
  button{font-family:inherit;color:inherit;background:transparent;border:0;padding:0;cursor:pointer;-webkit-appearance:none}

  /* ---------- camera + canvas stack ---------- */
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);z-index:0}
  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:block}
  canvas#three{z-index:2}
  canvas#bones{z-index:3}
  canvas#fx{z-index:1}

  /* ---------- boot screen ---------- */
  #boot{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at center,#0a0e1a 0%,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;color:var(--ink);text-align:center}
  #boot.hide{display:none}
  #boot .mark{width:120px;height:120px;opacity:.9}
  #boot h1{margin:0;font-size:36px;font-weight:800;letter-spacing:.14em}
  #boot .sub{color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase}
  #boot button.go{margin-top:12px;background:linear-gradient(135deg,var(--cold),var(--violet));color:#000;font-weight:800;font-size:16px;letter-spacing:.18em;text-transform:uppercase;padding:18px 44px;border-radius:999px;box-shadow:0 12px 42px rgba(68,224,255,.42)}
  #boot .note{color:var(--dim);font-family:var(--mono);font-size:11px;max-width:320px;line-height:1.5}
  #boot .credit{position:absolute;bottom:calc(16px + var(--safe-bot));font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}

  /* ---------- hud ---------- */
  .hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column}
  .hud.hide{display:none}

  /* top : logo + tabs */
  .top{padding:calc(var(--safe-top) + 10px) 10px 10px;display:flex;align-items:center;gap:8px;pointer-events:auto}
  .brand{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;backdrop-filter:blur(14px)}
  .brand .dot{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .tabs{flex:1;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(14px);overflow:hidden}
  .tabs button{flex:1;padding:12px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;font-weight:700;text-transform:uppercase;color:var(--dim);transition:all .18s;min-height:var(--tap)}
  .tabs button.on{color:#000;background:#fff}
  .tabs button.on.music{background:var(--cold)}
  .tabs button.on.sense{background:var(--lime)}
  .tabs button.on.flux{background:linear-gradient(90deg,var(--cold),var(--violet))}

  .right-tools{display:flex;gap:6px}
  .chip{background:var(--panel);border:1px solid var(--line);padding:0 10px;border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink);min-height:var(--tap);display:flex;align-items:center;gap:6px;backdrop-filter:blur(14px)}
  .chip b{color:var(--cold);font-weight:700;letter-spacing:.08em}
  .icon-btn{width:var(--tap);height:var(--tap);display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:50%;color:var(--ink);backdrop-filter:blur(14px)}
  .icon-btn svg{width:20px;height:20px}

  /* caption bar */
  .caption{align-self:center;margin-top:6px;background:var(--panel);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--ink);backdrop-filter:blur(14px);text-align:center;max-width:94vw}

  /* main zone spacer */
  .hud .spacer{flex:1}

  /* bottom shelves (one per mode) */
  .shelf{pointer-events:auto;padding:12px 10px calc(16px + var(--safe-bot));display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.72) 50%,rgba(0,0,0,.92) 100%)}
  .shelf.hide{display:none}

  /* bottom · generic row of large tappable buttons that scrolls horizontally */
  .scroll-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 4px 4px;scroll-snap-type:x mandatory}
  .scroll-row::-webkit-scrollbar{display:none}
  .pill{scroll-snap-align:start;flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:88px;min-height:var(--tap);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink);text-transform:uppercase;backdrop-filter:blur(14px)}
  .pill .emoji{font-size:22px;line-height:1}
  .pill .k{color:var(--dim);font-size:9px}
  .pill.on{border-color:var(--cold);background:rgba(68,224,255,.14);color:#fff}
  .pill.on.lime{border-color:var(--lime);background:rgba(156,255,107,.14)}
  .pill.on.violet{border-color:var(--violet);background:rgba(198,137,255,.14)}

  /* music mode HUD extras — note indicator + chord */
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .info-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;backdrop-filter:blur(14px)}
  .info-card .lab{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin-bottom:4px}
  .info-card .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .info-card .val.cold{color:var(--cold)}
  .info-card .val.lime{color:var(--lime)}

  /* drawer — settings */
  .drawer{position:fixed;top:calc(var(--safe-top) + 72px);bottom:calc(var(--safe-bot) + 16px);right:10px;width:min(320px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;overflow-y:auto;backdrop-filter:blur(18px);z-index:12;transform:translateX(calc(100% + 24px));transition:transform .28s cubic-bezier(.4,0,.2,1);pointer-events:auto}
  .drawer.open{transform:translateX(0)}
  .drawer h3{margin:0 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;font-weight:700}
  .drawer .row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
  .drawer .row:last-child{border-bottom:0}
  .drawer .row > label{font-size:13px;color:var(--ink);flex:1}
  .drawer select, .drawer input[type="range"]{flex:0 0 auto;width:150px;background:transparent;color:var(--ink);font-family:var(--mono);font-size:12px}
  .drawer select{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .drawer .close{position:sticky;top:0;float:right;margin:-6px -6px 6px 0;background:rgba(255,255,255,.08);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;color:var(--ink)}

  /* flux sub-scene bar — floats under top bar when flux is on */
  .fluxbar{align-self:center;display:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(14px);margin-top:6px;overflow:hidden}
  .fluxbar.on{display:flex}
  .fluxbar button{padding:10px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;min-height:40px;border-right:1px solid var(--line)}
  .fluxbar button:last-child{border-right:0}
  .fluxbar button.on{color:#000;background:#fff}

  /* subtle onboarding toast */
  .toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-top) + 100px);background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink);backdrop-filter:blur(14px);opacity:0;transition:opacity .25s}
  .toast.on{opacity:.95}

  @media (orientation:landscape) and (max-height:500px){
    .shelf{padding:10px 10px calc(10px + var(--safe-bot))}
    .scroll-row{padding-bottom:0}
    .pill{min-width:72px}
    .info-card .val{font-size:18px}
  }
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>
<canvas id="fx"></canvas>
<canvas id="three"></canvas>
<canvas id="bones"></canvas>

<!-- ---------- boot ---------- -->
<div id="boot">
  <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
    <defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9ec8ff"/></linearGradient></defs>
    <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,.1)"/>
    <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M60 50 L60 150"/><path d="M60 50 L120 50 C150 50,150 110,120 110 L60 110"/>
    </g>
    <circle cx="100" cy="100" r="8" fill="url(#bm)"/>
  </svg>
  <h1>PALMA</h1>
  <div class="sub">Gesture Instrument · 1Z4K</div>
  <button class="go" id="btn-start">Commencer</button>
  <div class="note">Autorise la caméra sur l'écran suivant. Rien n'est enregistré. Tiens tes mains devant la webcam pour jouer.</div>
  <div class="credit">Édité par 1Z4K</div>
</div>

<!-- ---------- HUD ---------- -->
<div class="hud hide" id="hud">
  <div class="top">
    <div class="brand"><span class="dot"></span>PALMA</div>
    <div class="tabs" id="tabs">
      <button class="on music" data-mode="music">musique</button>
      <button data-mode="sense">sensoriel</button>
      <button data-mode="flux">flux</button>
    </div>
    <div class="right-tools">
      <button class="icon-btn" id="btn-settings" aria-label="réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <!-- flux sub-scene bar -->
  <div class="fluxbar" id="fluxbar">
    <button data-fx="galaxy" class="on">galaxie</button>
    <button data-fx="aurora">aurore</button>
    <button data-fx="ink">encre</button>
    <button data-fx="plasma">plasma</button>
    <button data-fx="field">champ</button>
  </div>

  <div class="caption" id="caption">MAIN DROITE = MÉLODIE · MAIN GAUCHE = ACCORD</div>

  <div class="toast" id="toast">Montre tes deux mains à la caméra</div>

  <div class="spacer"></div>

  <!-- music shelf -->
  <div class="shelf music" id="shelf-music">
    <div class="info-grid">
      <div class="info-card"><div class="lab">note</div><div class="val cold" id="note-val">—</div></div>
      <div class="info-card"><div class="lab">accord</div><div class="val lime" id="chord-val">—</div></div>
    </div>
    <div class="scroll-row" id="inst-row"></div>
  </div>

  <!-- sense shelf -->
  <div class="shelf sense hide" id="shelf-sense">
    <div class="scroll-row" id="obj-row"></div>
  </div>

  <!-- flux shelf -->
  <div class="shelf flux hide" id="shelf-flux">
    <div class="info-grid">
      <div class="info-card"><div class="lab">mains</div><div class="val cold" id="hands-val">0</div></div>
      <div class="info-card"><div class="lab">geste</div><div class="val lime" id="gest-val">—</div></div>
    </div>
  </div>
</div>

<!-- ---------- Drawer settings ---------- -->
<div class="drawer" id="drawer">
  <button class="close" id="drawer-close" aria-label="fermer">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <h3>Musique</h3>
  <div class="row"><label>Tonalité</label>
    <select id="opt-key">
      <option>C</option><option>D</option><option>E</option><option>F</option><option selected>G</option><option>A</option><option>B</option>
    </select>
  </div>
  <div class="row"><label>Mode</label>
    <select id="opt-scale"><option value="maj">majeur</option><option value="min">mineur</option></select>
  </div>
  <div class="row"><label>Octave</label>
    <input type="range" id="opt-oct" min="2" max="6" step="1" value="4" />
  </div>
  <div class="row"><label>Reverb</label>
    <input type="range" id="opt-rev" min="0" max="1" step="0.01" value="0.3" />
  </div>
  <h3>Général</h3>
  <div class="row"><label>Squelette</label>
    <select id="opt-bones"><option value="1" selected>Afficher</option><option value="0">Masquer</option></select>
  </div>
  <div class="row"><label>Son</label>
    <select id="opt-mute"><option value="0" selected>Actif</option><option value="1">Muet</option></select>
  </div>
</div>

<!-- ---------- Libs ---------- -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" crossorigin="anonymous"></script>

<script>
"use strict";

// ---------- util ----------
const el = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;

// ---------- canvases ----------
const video = el("cam");
const fxc = el("fx"), threeC = el("three"), bonesC = el("bones");
const fx = fxc.getContext("2d"), g = bonesC.getContext("2d");
let W = 1, H = 1, DPR = 1;

// three globals (hoisted for setup order)
var renderer3D, camera3D, scene3D, sceneRoot, envMap;
var FLUX_READY = false;

function sizeCanvas(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [fxc, bonesC]){
    c.width = Math.floor(W*DPR); c.height = Math.floor(H*DPR);
    c.style.width = W+"px"; c.style.height = H+"px";
    c.getContext("2d").setTransform(DPR,0,0,DPR,0,0);
  }
  threeC.width = Math.floor(W*DPR); threeC.height = Math.floor(H*DPR);
  threeC.style.width = W+"px"; threeC.style.height = H+"px";
  if (renderer3D){
    renderer3D.setPixelRatio(DPR);
    renderer3D.setSize(W, H, false);
    camera3D.aspect = W/H;
    camera3D.updateProjectionMatrix();
  }
  if (FLUX_READY) FLUX.resize();
}
window.addEventListener("resize", sizeCanvas);
window.addEventListener("orientationchange", () => setTimeout(sizeCanvas, 150));

// ---------- state ----------
let MODE = "music";    // music | sense | flux
let OBJ_KEY = "cube";
let FX_KEY  = "galaxy";
let latest = { multiHandLandmarks: [], multiHandedness: [] };
let lastT = performance.now();

// ---------- audio ----------
let master, mel, chord, reverb;
let AUDIO_READY = false;
let mutedFlag = false;

const INSTRUMENTS = {
  piano:    { label: "Piano",    emoji: "🎹", osc: { type: "triangle" },    env: { attack: 0.004, decay: 0.3, sustain: 0.3, release: 1.0 } },
  pad:      { label: "Pad",      emoji: "🌊", osc: { type: "sine" },        env: { attack: 0.6, decay: 0.5, sustain: 0.8, release: 2.5 } },
  pluck:    { label: "Pluck",    emoji: "🪕", osc: { type: "sawtooth" },    env: { attack: 0.002, decay: 0.12, sustain: 0.0, release: 0.3 } },
  organ:    { label: "Orgue",    emoji: "⛪", osc: { type: "sine" },        env: { attack: 0.01, decay: 0.1, sustain: 1, release: 0.1 } },
  flute:    { label: "Flûte",    emoji: "🪈", osc: { type: "sine" },        env: { attack: 0.08, decay: 0.2, sustain: 0.9, release: 0.4 } },
  bells:    { label: "Cloches", emoji: "🔔", osc: { type: "triangle" },     env: { attack: 0.001, decay: 0.4, sustain: 0.1, release: 1.4 } },
  harp:     { label: "Harpe",   emoji: "🎼", osc: { type: "sawtooth" },     env: { attack: 0.003, decay: 0.3, sustain: 0.2, release: 1.2 } },
  strings:  { label: "Cordes",  emoji: "🎻", osc: { type: "sawtooth" },     env: { attack: 0.3, decay: 0.3, sustain: 0.8, release: 1.6 } },
  bass:     { label: "Basse",   emoji: "🎸", osc: { type: "square" },       env: { attack: 0.01, decay: 0.2, sustain: 0.5, release: 0.3 } },
  lead:     { label: "Lead",    emoji: "⚡",  osc: { type: "sawtooth" },     env: { attack: 0.005, decay: 0.1, sustain: 0.7, release: 0.2 } },
  voice:    { label: "Voix",    emoji: "🎤", osc: { type: "sine" },         env: { attack: 0.08, decay: 0.3, sustain: 0.6, release: 0.8 } }
};
let INSTR = "piano";

async function initAudio(){
  await Tone.start();
  Tone.context.lookAhead = 0.02;
  master = new Tone.Gain(0.9).toDestination();
  reverb = new Tone.Reverb({ decay: 3.5, wet: 0.3 }).connect(master);
  mel   = new Tone.PolySynth(Tone.Synth, {}).connect(reverb);
  chord = new Tone.PolySynth(Tone.Synth, {}).connect(reverb);
  setInstrument(INSTR);
  AUDIO_READY = true;
}
function setInstrument(key){
  INSTR = key;
  const p = INSTRUMENTS[key] || INSTRUMENTS.piano;
  mel.set({ oscillator: p.osc, envelope: p.env });
  chord.set({ oscillator: { type: "triangle" }, envelope: { attack: 0.03, decay: 0.3, sustain: 0.7, release: 1.2 } });
  chord.volume.value = -6;
}

// ---------- music logic ----------
const KEY_ROOTS = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
const SCALE_STEPS = { maj:[0,2,4,5,7,9,11], min:[0,2,3,5,7,8,10] };
function midiToFreq(m){ return Tone.Frequency(m, "midi").toFrequency(); }
function midiToName(m){ return Tone.Frequency(m, "midi").toNote(); }
function melodyNotes(rk, md, oct){
  const base = 12 * (oct+1) + (KEY_ROOTS[rk] || 7);
  const steps = SCALE_STEPS[md] || SCALE_STEPS.maj;
  return [0,2,4,5,6].map(i => midiToFreq(base + steps[i]));
}
function chordNotes(n, rk, md, oct){
  const base = 12 * oct + (KEY_ROOTS[rk] || 7);
  const degIdx = clamp(n-1, 0, 4);
  const steps = SCALE_STEPS[md] || SCALE_STEPS.maj;
  const root = base + steps[degIdx];
  const third = root + (md === "maj" ? 4 : 3);
  const fifth = root + 7;
  return { notes: [midiToFreq(root), midiToFreq(third), midiToFreq(fifth)], symbol: midiToName(root).replace(/[0-9]/g,"") + (md==="maj"?"":"m") };
}
let MEL_ACTIVE = null, CHORD_ACTIVE = null;

// ---------- hands ----------
let hands;
async function initHands(){
  hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}` });
  hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.55, minTrackingConfidence: 0.5, selfieMode: true });
  hands.onResults(r => latest = r);
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width:{ ideal: 1280 }, height:{ ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  async function loop(){
    if (video.readyState >= 2) await hands.send({ image: video });
    requestAnimationFrame(loop);
  }
  loop();
}

const FINGERS = [
  { name:"thumb",  mcp:2,  pip:3,  tip:4,  color:"#ffd166" },
  { name:"index",  mcp:5,  pip:6,  tip:8,  color:"#44e0ff" },
  { name:"middle", mcp:9,  pip:10, tip:12, color:"#ff2d7a" },
  { name:"ring",   mcp:13, pip:14, tip:16, color:"#9cff6b" },
  { name:"pinky",  mcp:17, pip:18, tip:20, color:"#c689ff" }
];
function detectExtended(lm){
  const wrist = lm[0], out = [];
  for (let i = 0; i < 5; i++){
    const f = FINGERS[i];
    const tip = lm[f.tip], pip = lm[f.pip], mcp = lm[f.mcp];
    if (i === 0){
      const palm = lm[9];
      out.push(Math.hypot(tip.x-palm.x, tip.y-palm.y) > Math.hypot(mcp.x-palm.x, mcp.y-palm.y) * 1.15);
    } else {
      if (Math.hypot(tip.x-wrist.x, tip.y-wrist.y) < Math.hypot(pip.x-wrist.x, pip.y-wrist.y) * 1.05){ out.push(false); continue; }
      const a = { x: pip.x-mcp.x, y: pip.y-mcp.y }, b = { x: tip.x-pip.x, y: tip.y-pip.y };
      const la = Math.hypot(a.x,a.y) || 1e-6, lb = Math.hypot(b.x,b.y) || 1e-6;
      out.push((a.x*b.x + a.y*b.y)/(la*lb) > 0.55);
    }
  }
  return out;
}

function lmToPx(ux, uy){
  const vw = video.videoWidth || 960, vh = video.videoHeight || 720;
  const s = Math.max(W/vw, H/vh);
  const dw = vw*s, dh = vh*s;
  const ox = (W-dw)/2, oy = (H-dh)/2;
  return { x: ox + ux*dw, y: oy + uy*dh };
}

function drawBones(showBones){
  g.clearRect(0, 0, W, H);
  if (!showBones) return;
  const list = latest.multiHandLandmarks || [];
  const handed = latest.multiHandedness || [];
  const EDGES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
  for (let hi = 0; hi < list.length; hi++){
    const lm = list[hi];
    const label = handed[hi]?.label || (hi === 0 ? "Right" : "Left");
    const col = label === "Right" ? "#44e0ff" : "#ff2d7a";
    g.strokeStyle = col; g.lineWidth = 2.5; g.lineCap = "round";
    for (const [a,b] of EDGES){
      const A = lmToPx(lm[a].x, lm[a].y), B = lmToPx(lm[b].x, lm[b].y);
      g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke();
    }
    g.fillStyle = col;
    for (let i = 0; i < lm.length; i++){
      const p = lmToPx(lm[i].x, lm[i].y);
      g.beginPath(); g.arc(p.x, p.y, i === 0 ? 5 : 3.5, 0, Math.PI*2); g.fill();
    }
  }
}

function buildEnv(){
  const pm = new THREE.PMREMGenerator(renderer3D);
  pm.compileEquirectangularShader();
  const c = document.createElement("canvas"); c.width = 512; c.height = 256;
  const ctx = c.getContext("2d");
  const grad = ctx.createLinearGradient(0,0,0,256);
  grad.addColorStop(0, "#0a0a16"); grad.addColorStop(0.5, "#223044"); grad.addColorStop(1, "#5a6a80");
  ctx.fillStyle = grad; ctx.fillRect(0,0,512,256);
  ctx.fillStyle = "rgba(255,70,140,.65)"; ctx.beginPath(); ctx.arc(140, 100, 70, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(60,180,255,.65)"; ctx.beginPath(); ctx.arc(380, 110, 70, 0, Math.PI*2); ctx.fill();
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  const em = pm.fromEquirectangular(t).texture;
  pm.dispose(); t.dispose();
  return em;
}
function rebuildMesh(phy, kind, accentHex){
  const T = THREE;
  if (phy.mesh){ sceneRoot.remove(phy.mesh); phy.mesh.geometry && phy.mesh.geometry.dispose(); phy.mesh.material && phy.mesh.material.dispose(); phy.mesh = null; }
  let geo;
  if (kind === "cube")        geo = new T.BoxGeometry(1,1,1);
  else if (kind === "sphere") geo = new T.SphereGeometry(0.7, 42, 32);
  else if (kind === "crystal")geo = new T.OctahedronGeometry(0.85, 2);
  else if (kind === "heart"){
    const s = new T.Shape();
    s.moveTo(0, 0.5); s.bezierCurveTo(0,0.9,0.6,0.9,0.6,0.5); s.bezierCurveTo(0.6,0.2,0,0.1,0,-0.2);
    s.bezierCurveTo(0,0.1,-0.6,0.2,-0.6,0.5); s.bezierCurveTo(-0.6,0.9,0,0.9,0,0.5);
    geo = new T.ExtrudeGeometry(s, { depth: 0.3, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05 });
    geo.center();
  }
  else if (kind === "star"){
    const s = new T.Shape();
    for (let i=0;i<10;i++){ const a=i*Math.PI/5, r=i%2===0?0.9:0.38; s.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
    s.closePath();
    geo = new T.ExtrudeGeometry(s, { depth: 0.2, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03 });
    geo.center();
  }
  else if (kind === "donut")  geo = new T.TorusGeometry(0.55, 0.22, 24, 60);
  else if (kind === "pyramid")geo = new T.TetrahedronGeometry(0.85, 0);
  else if (kind === "planet") geo = new T.SphereGeometry(0.75, 40, 28);
  else if (kind === "mercury")geo = new T.IcosahedronGeometry(0.7, 5);
  else if (kind === "prism")  geo = new T.CylinderGeometry(0.0, 0.7, 1.0, 3);
  else                        geo = new T.BoxGeometry(1,1,1);

  let mat;
  if (kind === "mercury") mat = new T.MeshPhysicalMaterial({ color: 0xc0c7d0, metalness: 1, roughness: 0.05, clearcoat: 1 });
  else if (kind === "planet") mat = new T.MeshPhysicalMaterial({ color: accentHex, metalness: 0.5, roughness: 0.3, clearcoat: 0.8 });
  else if (kind === "crystal") mat = new T.MeshPhysicalMaterial({ color: accentHex, metalness: 0.3, roughness: 0.05, transmission: 0.7, thickness: 0.6, clearcoat: 1 });
  else mat = new T.MeshPhysicalMaterial({ color: accentHex, metalness: 0.4, roughness: 0.25, clearcoat: 0.8 });

  phy.mesh = new T.Mesh(geo, mat);
  phy.mesh.scale.setScalar(0.6);
  if (kind === "mercury") phy.baseVerts = new Float32Array(geo.attributes.position.array);
  else phy.baseVerts = null;
  const obj = OBJECTS.find(o => o.key === kind);
  phy.baseScale = obj ? obj.baseScale : 0.22;
  sceneRoot.add(phy.mesh);
}

function updateSense(dt, now){
  const list = latest.multiHandLandmarks || [];
  const handed = latest.multiHandedness || [];
  let rightHand = null, leftHand = null;
  for (let i = 0; i < list.length; i++){
    const label = handed[i]?.label || (i === 0 ? "Right" : "Left");
    if (label === "Right") rightHand = list[i]; else leftHand = list[i];
  }
  tickPhysics(PHY_R, rightHand, dt, now, HAND_HIST_R);
  tickPhysics(PHY_L, leftHand,  dt, now, HAND_HIST_L);
  renderer3D.render(scene3D, camera3D);
}
function tickPhysics(phy, hand, dt, now, hist){
  if (!phy.mesh) return;
  // world anchor above palm (lm 9 — middle base)
  let anchor = null, palmWidthN = 0.15, handOpen = false, extCount = 0;
  if (hand){
    const z0 = camera3D.position.z;
    const vH = 2 * Math.tan((camera3D.fov * Math.PI / 180) / 2) * z0;
    const vW = vH * camera3D.aspect;
    const palmX = hand[9].x, palmY = hand[9].y;
    const wx = (palmX - 0.5) * vW;
    const wy = (0.5 - palmY) * vH;
    anchor = new THREE.Vector3(wx, wy + 0.4, 0);
    palmWidthN = Math.hypot(hand[5].x - hand[17].x, hand[5].y - hand[17].y);
    const ext = detectExtended(hand);
    extCount = ext.filter(Boolean).length;
    handOpen = extCount >= 3;
    hist.push({ x: wx, y: wy, time: now });
    while (hist.length > HAND_HIST_MAX) hist.shift();
  }

  // velocity
  let handVel = new THREE.Vector3();
  if (hist.length >= 2){
    const f = hist[0], l = hist[hist.length-1];
    const dts = Math.max(0.001, (l.time - f.time) * 0.001);
    handVel.set((l.x - f.x)/dts, (l.y - f.y)/dts, 0);
  }

  const REF_W = 0.18;
  const palmRatio = clamp(palmWidthN / REF_W, 0.35, 2.2);
  phy.targetScale = phy.baseScale * palmRatio * 5.5;
  phy.scale += (phy.targetScale - phy.scale) * 0.18;
  phy.mesh.scale.setScalar(phy.scale);

  if (phy.state === "hover"){
    if (hand && anchor){
      const bob = Math.sin(now * 0.0022) * 0.04;
      const target = anchor.clone(); target.y += bob;
      phy.pos.lerp(target, 0.22);
      if (!handOpen && extCount <= 1) phy.state = "held";
    }
  } else if (phy.state === "held"){
    if (hand && anchor){
      const target = anchor.clone(); target.y -= 0.25;
      phy.pos.lerp(target, 0.4);
      if (handOpen){
        if (handVel.length() > 1.1){
          phy.vel.copy(handVel).multiplyScalar(1.6); phy.vel.z = 0;
          phy.state = "thrown"; phy.justThrown = 0.5;
        } else phy.state = "hover";
      }
    } else phy.state = "hover";
  } else if (phy.state === "thrown"){
    phy.vel.y -= 4.5 * dt;
    phy.vel.multiplyScalar(0.99);
    phy.pos.addScaledVector(phy.vel, dt);
    phy.justThrown = Math.max(0, phy.justThrown - dt);
    if (hand && anchor && handOpen && phy.justThrown === 0){
      if (phy.pos.distanceTo(anchor) < 0.8 * palmRatio){ phy.state = "hover"; phy.vel.set(0,0,0); }
    }
    if (phy.pos.y < -3 || Math.abs(phy.pos.x) > 6){
      if (hand && anchor) phy.pos.copy(anchor); else phy.pos.set(0,0,0);
      phy.vel.set(0,0,0); phy.state = "hover";
    }
  }
  phy.mesh.position.copy(phy.pos);

  if (phy.state === "thrown"){ phy.mesh.rotation.x += 2.5*dt; phy.mesh.rotation.y += 3.1*dt; phy.mesh.rotation.z += 1.7*dt; }
  else if (phy.state === "held"){ phy.mesh.rotation.x = Math.sin(now*0.0004)*0.1; phy.mesh.rotation.y += 0.5*dt; }
  else { phy.mesh.rotation.y += 0.5*dt; phy.mesh.rotation.x = Math.sin(now*0.0006)*0.1; }

  if (OBJ_KEY === "mercury" && phy.baseVerts){
    const pos = phy.mesh.geometry.attributes.position, base = phy.baseVerts;
    const amp = (phy.state === "thrown") ? 0.18 : 0.08;
    const t = now * 0.002;
    for (let i = 0; i < pos.count; i++){
      const bx=base[i*3], by=base[i*3+1], bz=base[i*3+2];
      const n = Math.sin(bx*3+t*2)*Math.cos(by*3+t*1.3)*Math.sin(bz*3+t*0.9);
      const s = 1 + n * amp;
      pos.array[i*3  ] = bx*s; pos.array[i*3+1] = by*s; pos.array[i*3+2] = bz*s;
    }
    pos.needsUpdate = true; phy.mesh.geometry.computeVertexNormals();
  }
}

// ---------- FLUX (GPU particles, 2-hand attractors) ----------
class OneEuro{
  constructor(minCut=1.0, beta=0.08, dCut=1.0){ this.minCut=minCut; this.beta=beta; this.dCut=dCut; this.xPrev=null; this.dxPrev=0; this.tPrev=0; }
  _alpha(c,dt){ const tau=1/(2*Math.PI*c); return 1/(1+tau/dt); }
  filter(x,t){ if (this.xPrev===null){ this.xPrev=x; this.tPrev=t; return x; }
    const dt=Math.max(1e-3, t-this.tPrev);
    const dx=(x-this.xPrev)/dt;
    const aD=this._alpha(this.dCut, dt); const edx=aD*dx+(1-aD)*this.dxPrev;
    const cut=this.minCut+this.beta*Math.abs(edx);
    const a=this._alpha(cut, dt); const y=a*x+(1-a)*this.xPrev;
    this.xPrev=y; this.dxPrev=edx; this.tPrev=t; return y; }
  reset(){ this.xPrev=null; this.dxPrev=0; this.tPrev=0; }
}

const FLUX = {
  ready: false, N: 14000,
  scn: null, cam: null, pts: null, ptsMat: null, orthoCam: null, quad: null,
  sceneRT: null, trailA: null, trailB: null, brightRT: null, bloomH: null, bloomV: null,
  mFade: null, mBright: null, mBlurH: null, mBlurV: null, mFinal: null,
  attrs: null, filtersR: [], filtersL: [], hue: 0.58, uHandOn: 0, uBurst: 0, uFist: 0,

  init(){
    if (this.ready) return;
    const T = THREE;
    this.scn = new T.Scene();
    this.cam = new T.PerspectiveCamera(60, W/Math.max(1,H), 0.1, 50);
    this.cam.position.set(0,0,4);
    this.orthoCam = new T.OrthographicCamera(-1,1,1,-1,0,1);
    this.quad = new T.Mesh(new T.PlaneGeometry(2,2), new T.MeshBasicMaterial());
    for (let i=0;i<42;i++){ this.filtersR.push(new OneEuro(1.2, 0.06)); this.filtersL.push(new OneEuro(1.2, 0.06)); }
    this.attrs = [];
    for (let i=0;i<6;i++) this.attrs.push(new T.Vector3());
    // 6 attractors = 3 per hand (palm + index + thumb); unused ones stay at origin

    const N = this.N;
    const geo = new T.BufferGeometry();
    const pos = new Float32Array(N*3), seed = new Float32Array(N*4);
    for (let i=0;i<N;i++){ seed[i*4]=Math.random(); seed[i*4+1]=Math.random(); seed[i*4+2]=Math.random(); seed[i*4+3]=Math.random(); }
    geo.setAttribute("position", new T.BufferAttribute(pos, 3));
    geo.setAttribute("aSeed", new T.BufferAttribute(seed, 4));
    geo.boundingSphere = new T.Sphere(new T.Vector3(), 20);

    const vs = `
      attribute vec4 aSeed;
      uniform float uTime, uDPR, uHandOn, uBurst, uFist, uHue;
      uniform vec3 uAttr[6];
      uniform float uOrbit; uniform vec2 uSpread;
      uniform float uDriftAmp, uAttrStrength, uHueBase, uHueSpread, uZSpread;
      varying vec3 vCol; varying float vA;
      vec3 hash3(vec3 p){ p=fract(p*vec3(.1031,.103,.0973)); p+=dot(p,p.yxz+33.33); return fract((p.xxy+p.yxx)*p.zyx); }
      float noise(vec3 p){
        vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
        float n000=hash3(i).x, n100=hash3(i+vec3(1,0,0)).x, n010=hash3(i+vec3(0,1,0)).x, n110=hash3(i+vec3(1,1,0)).x;
        float n001=hash3(i+vec3(0,0,1)).x, n101=hash3(i+vec3(1,0,1)).x, n011=hash3(i+vec3(0,1,1)).x, n111=hash3(i+vec3(1,1,1)).x;
        float nx00=mix(n000,n100,f.x), nx10=mix(n010,n110,f.x), nx01=mix(n001,n101,f.x), nx11=mix(n011,n111,f.x);
        return mix(mix(nx00,nx10,f.y), mix(nx01,nx11,f.y), f.z);
      }
      void main(){
        float life = fract(aSeed.w + uTime*0.05);
        vA = smoothstep(0.,0.15,life) * smoothstep(1.,0.85,life);
        float arm = floor(aSeed.x * 3.0);
        float ang = aSeed.y*6.2831 + uTime*(0.18 + aSeed.z*0.1) + arm*2.09;
        float rad = uSpread.x * pow(aSeed.z, 0.9) + aSeed.x*0.3;
        vec3 orbit = vec3(cos(ang)*rad, sin(ang)*rad*0.82, (aSeed.x-0.5)*uZSpread);
        float fx = (aSeed.y-0.5)*uSpread.x*2.0 + sin(uTime + aSeed.x*6.283)*0.5;
        float fy = (aSeed.z-0.5)*uSpread.y*2.0;
        float fz = (aSeed.x-0.5)*uZSpread;
        vec3 flow = vec3(fx, fy, fz);
        vec3 p = mix(flow, orbit, uOrbit);
        float amp = uDriftAmp + uBurst*0.6;
        p.x += (noise(p*1.4 + uTime*0.12)-0.5) * amp;
        p.y += (noise(p.yzx*1.6 + uTime*0.09)-0.5) * amp;
        p.z += (noise(p.zxy*1.2 + uTime*0.07)-0.5) * amp*0.5;
        for (int k=0;k<6;k++){
          vec3 d = uAttr[k] - p;
          float r2 = max(0.35, dot(d,d));
          float g = (k==0 || k==3) ? 0.6 : 0.18;
          p += d/r2 * uHandOn * g * uAttrStrength * (0.7 + uBurst*1.6);
        }
        p += (-p) * uFist * 0.15;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        float sz = 0.55 + aSeed.x*0.9 + uBurst*1.0;
        gl_PointSize = sz * uDPR * (240./max(0.1,-mv.z));
        float hue = fract(uHueBase + uHue*0.1 + aSeed.y*uHueSpread);
        vec3 base = 0.5 + 0.5*cos(6.2831*(vec3(hue) + vec3(0,0.33,0.66)));
        vCol = mix(base, vec3(1,0.75,0.42), uBurst*0.7);
      }
    `;
    const fs = `
      varying vec3 vCol; varying float vA;
      void main(){
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        if (d > 0.5) discard;
        float a = smoothstep(0.5,0.0,d); a *= a;
        gl_FragColor = vec4(vCol * a * 0.5, a * vA * 0.6);
      }
    `;
    this.ptsMat = new T.ShaderMaterial({
      vertexShader: vs, fragmentShader: fs,
      uniforms:{
        uTime:{value:0}, uDPR:{value:Math.min(window.devicePixelRatio||1,2)},
        uHandOn:{value:0}, uBurst:{value:0}, uFist:{value:0}, uHue:{value:this.hue},
        uAttr:{value:this.attrs},
        uOrbit:{value:1.0}, uSpread:{value:new T.Vector2(2.8,2.3)},
        uDriftAmp:{value:0.6}, uAttrStrength:{value:1.0},
        uHueBase:{value:0.58}, uHueSpread:{value:0.35}, uZSpread:{value:0.5}
      },
      transparent:true, depthTest:false, depthWrite:false, blending:T.AdditiveBlending
    });
    this.pts = new T.Points(geo, this.ptsMat); this.pts.frustumCulled = false; this.scn.add(this.pts);
    this._buildRTs(); this._buildPostShaders();
    this.ready = true; FLUX_READY = true;
    this.setScene("galaxy");
  },

  _buildRTs(){
    const T = THREE;
    const dpr = Math.min(window.devicePixelRatio||1,2);
    const w = Math.max(2, Math.floor(W*dpr)), h = Math.max(2, Math.floor(H*dpr));
    const hw = Math.max(2, w>>1), hh = Math.max(2, h>>1);
    const qw = Math.max(2, hw>>1), qh = Math.max(2, hh>>1);
    const opts = { minFilter:T.LinearFilter, magFilter:T.LinearFilter, type:T.UnsignedByteType, format:T.RGBAFormat };
    for (const k of ["sceneRT","trailA","trailB","brightRT","bloomH","bloomV"]) if (this[k]) this[k].dispose();
    this.sceneRT  = new T.WebGLRenderTarget(w, h, opts);
    this.trailA   = new T.WebGLRenderTarget(w, h, opts);
    this.trailB   = new T.WebGLRenderTarget(w, h, opts);
    this.brightRT = new T.WebGLRenderTarget(hw, hh, opts);
    this.bloomH   = new T.WebGLRenderTarget(qw, qh, opts);
    this.bloomV   = new T.WebGLRenderTarget(qw, qh, opts);
  },

  _buildPostShaders(){
    const T = THREE;
    const vsQ = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
    this.mFade = new T.ShaderMaterial({
      uniforms:{ tPrev:{value:null}, tScene:{value:null}, uDecay:{value:.905}, uSwirl:{value:.0018} },
      vertexShader: vsQ,
      fragmentShader:`varying vec2 vUv; uniform sampler2D tPrev, tScene; uniform float uDecay, uSwirl;
        void main(){ vec2 d=vUv-0.5; float r=length(d); float ang=uSwirl*(0.3+r*2.0);
          float ca=cos(ang), sa=sin(ang); vec2 rot=vec2(ca*d.x - sa*d.y, sa*d.x + ca*d.y);
          vec2 sh = 0.5 + rot + d*0.004;
          vec3 prev = texture2D(tPrev, sh).rgb * uDecay;
          vec3 cur  = texture2D(tScene, vUv).rgb;
          gl_FragColor = vec4(max(prev, cur), 1.0);
        }`,
      depthTest:false, depthWrite:false
    });
    this.mBright = new T.ShaderMaterial({
      uniforms:{ tSrc:{value:null}, uTh:{value:.88} }, vertexShader: vsQ,
      fragmentShader:`varying vec2 vUv; uniform sampler2D tSrc; uniform float uTh;
        void main(){ vec3 c=texture2D(tSrc, vUv).rgb; float b=max(max(c.r,c.g),c.b);
          float m = smoothstep(uTh, uTh+0.25, b);
          gl_FragColor = vec4(c * m * 0.6, 1.0); }`
    });
    const gauss = `varying vec2 vUv; uniform sampler2D tSrc; uniform vec2 uDir;
      void main(){ vec3 s = vec3(0.0);
        s += texture2D(tSrc, vUv).rgb * 0.227027;
        s += texture2D(tSrc, vUv + uDir*1.3846).rgb * 0.316216;
        s += texture2D(tSrc, vUv - uDir*1.3846).rgb * 0.316216;
        s += texture2D(tSrc, vUv + uDir*3.2307).rgb * 0.070270;
        s += texture2D(tSrc, vUv - uDir*3.2307).rgb * 0.070270;
        gl_FragColor = vec4(s, 1.0);
      }`;
    this.mBlurH = new T.ShaderMaterial({ uniforms:{ tSrc:{value:null}, uDir:{value:new T.Vector2(1,0)} }, vertexShader: vsQ, fragmentShader: gauss });
    this.mBlurV = new T.ShaderMaterial({ uniforms:{ tSrc:{value:null}, uDir:{value:new T.Vector2(0,1)} }, vertexShader: vsQ, fragmentShader: gauss });
    this.mFinal = new T.ShaderMaterial({
      uniforms:{ tTrail:{value:null}, tBloom:{value:null}, uChroma:{value:.003}, uTime:{value:0}, uGain:{value:1.35} },
      vertexShader: vsQ,
      fragmentShader:`varying vec2 vUv; uniform sampler2D tTrail, tBloom; uniform float uChroma, uTime, uGain;
        void main(){ vec2 d = vUv - 0.5;
          float r = texture2D(tTrail, vUv + d*uChroma).r + texture2D(tBloom, vUv + d*uChroma).r;
          float g = texture2D(tTrail, vUv).g + texture2D(tBloom, vUv).g;
          float b = texture2D(tTrail, vUv - d*uChroma).b + texture2D(tBloom, vUv - d*uChroma).b;
          vec3 col = vec3(r,g,b) * uGain;
          col = col / (1.0 + col); col = pow(col, vec3(0.88));
          float grain = fract(sin(dot(vUv*1024.0 + uTime, vec2(12.9898, 78.233)))*43758.5453);
          col += (grain - 0.5) * 0.02;
          float v = smoothstep(1.2, 0.3, length(d)*2.0);
          col *= v;
          gl_FragColor = vec4(col, 1.0);
        }`
    });
  },

  PRESETS:{
    galaxy:{ orbit:1.0, spread:[2.8,2.3], drift:0.6, attr:1.0, hueBase:0.58, hueSpread:0.35, zSpread:0.5, decay:0.908, swirl:0.0014, chroma:0.003, bloomTh:0.88, gain:1.35 },
    aurora:{ orbit:0.0, spread:[5.5,1.4], drift:1.1, attr:0.55, hueBase:0.38, hueSpread:0.3,  zSpread:0.25, decay:0.955, swirl:0.0006, chroma:0.0025, bloomTh:0.8, gain:1.5 },
    ink:   { orbit:0.0, spread:[3.0,3.0], drift:0.45, attr:1.2, hueBase:0.55, hueSpread:0.08, zSpread:1.0, decay:0.97, swirl:0.002, chroma:0.002, bloomTh:0.9, gain:1.2 },
    plasma:{ orbit:1.0, spread:[2.2,2.2], drift:0.28, attr:1.6, hueBase:0.72, hueSpread:0.22, zSpread:0.4, decay:0.9, swirl:0.0032, chroma:0.007, bloomTh:0.78, gain:1.6 },
    field: { orbit:0.0, spread:[4.5,2.8], drift:1.3, attr:0.35, hueBase:0.58, hueSpread:0.45, zSpread:0.9, decay:0.93, swirl:0.0008, chroma:0.004, bloomTh:0.86, gain:1.4 }
  },
  activeScene:"galaxy",

  setScene(k){
    const p = this.PRESETS[k]; if (!p || !this.ptsMat) return;
    this.activeScene = k;
    const u = this.ptsMat.uniforms;
    u.uOrbit.value = p.orbit;
    u.uSpread.value.set(p.spread[0], p.spread[1]);
    u.uDriftAmp.value = p.drift; u.uAttrStrength.value = p.attr;
    u.uHueBase.value = p.hueBase; u.uHueSpread.value = p.hueSpread; u.uZSpread.value = p.zSpread;
    this._decay = p.decay; this._swirl = p.swirl; this._chroma = p.chroma; this._gain = p.gain;
    if (this.mBright) this.mBright.uniforms.uTh.value = p.bloomTh;
    for (const rt of [this.trailA, this.trailB]){
      if (!rt) continue;
      renderer3D.setRenderTarget(rt);
      renderer3D.setClearColor(0x000000, 1); renderer3D.clear(true,true,true);
    }
    renderer3D.setRenderTarget(null);
  },

  resize(){
    if (!this.ready) return;
    this.cam.aspect = W/Math.max(1,H); this.cam.updateProjectionMatrix();
    this.ptsMat.uniforms.uDPR.value = Math.min(window.devicePixelRatio||1, 2);
    this._buildRTs();
  },

  tick(dt, t){
    if (!this.ready) return;
    const list = latest.multiHandLandmarks || [];
    const handed = latest.multiHandedness || [];
    let right = null, left = null;
    for (let i = 0; i < list.length; i++){
      const label = handed[i]?.label || (i === 0 ? "Right" : "Left");
      if (label === "Right") right = list[i]; else left = list[i];
    }
    const handCount = list.length;
    el("hands-val").textContent = handCount;

    const vH = 2 * Math.tan((60*Math.PI/180)/2) * 4.0;
    const vW = vH * (W/Math.max(1,H));
    const toX = ux => (ux - 0.5) * vW * 0.42;
    const toY = uy => (0.5 - uy) * vH * 0.42;

    // 6 attractors: [R palm, R index, R thumb, L palm, L index, L thumb]
    const pickIdx = [9, 8, 4];
    for (let slot = 0; slot < 3; slot++){
      const idx = pickIdx[slot];
      if (right){
        const px = this.filtersR[idx*2].filter(right[idx].x, t);
        const py = this.filtersR[idx*2+1].filter(right[idx].y, t);
        this.attrs[slot].set(toX(px), toY(py), 0);
      } else { this.attrs[slot].multiplyScalar(0.9); }
      if (left){
        const px = this.filtersL[idx*2].filter(left[idx].x, t);
        const py = this.filtersL[idx*2+1].filter(left[idx].y, t);
        this.attrs[slot + 3].set(toX(px), toY(py), 0);
      } else { this.attrs[slot + 3].multiplyScalar(0.9); }
    }

    let burstTarget = 0, fistTarget = 0, gestLabel = "—";
    for (const h of [right, left]){
      if (!h) continue;
      const ext = detectExtended(h);
      const n = ext.filter(Boolean).length;
      if (n >= 4){ gestLabel = "ouverte"; }
      if (n <= 1){ fistTarget = 1; gestLabel = "poing"; }
      const pD = Math.hypot(h[4].x - h[8].x, h[4].y - h[8].y);
      if (pD < 0.06){ burstTarget = 1; gestLabel = "pincement"; }
    }
    el("gest-val").textContent = gestLabel;

    const hon = (right || left) ? 1 : 0;
    this.uHandOn += (hon - this.uHandOn) * 0.18;
    this.uBurst  += (burstTarget - this.uBurst) * 0.22;
    this.uFist   += (fistTarget - this.uFist) * 0.15;
    if (!(right || left)){ this.filtersR.forEach(f=>f.reset()); this.filtersL.forEach(f=>f.reset()); }

    this.hue = (this.hue + dt * 0.012) % 1;
    const U = this.ptsMat.uniforms;
    U.uTime.value = t; U.uHandOn.value = this.uHandOn; U.uBurst.value = this.uBurst; U.uFist.value = this.uFist; U.uHue.value = this.hue;
    this.mFinal.uniforms.uTime.value = t;
    this.mFade.uniforms.uDecay.value   = (this._decay  || 0.908) - this.uBurst * 0.05;
    this.mFade.uniforms.uSwirl.value   = (this._swirl  || 0.0014) + this.uFist * 0.0028;
    this.mFinal.uniforms.uChroma.value = (this._chroma || 0.003) + this.uBurst * 0.005;
    this.mFinal.uniforms.uGain.value   = (this._gain   || 1.35) + this.uBurst * 0.35;
  },

  _drawQuad(mat, target){
    this.quad.material = mat;
    renderer3D.setRenderTarget(target || null);
    renderer3D.render(this.quad, this.orthoCam);
  },

  render(){
    if (!this.ready) return;
    renderer3D.setRenderTarget(this.sceneRT);
    renderer3D.setClearColor(0x000000, 1); renderer3D.clear(true,true,true);
    renderer3D.render(this.scn, this.cam);

    this.mFade.uniforms.tPrev.value  = this.trailB.texture;
    this.mFade.uniforms.tScene.value = this.sceneRT.texture;
    this._drawQuad(this.mFade, this.trailA);
    const tmp = this.trailB; this.trailB = this.trailA; this.trailA = tmp;

    this.mBright.uniforms.tSrc.value = this.trailB.texture;
    this._drawQuad(this.mBright, this.brightRT);
    const bw = this.bloomH.width, bh = this.bloomH.height;
    this.mBlurH.uniforms.tSrc.value = this.brightRT.texture;
    this.mBlurH.uniforms.uDir.value.set(1/bw, 0);
    this._drawQuad(this.mBlurH, this.bloomH);
    this.mBlurV.uniforms.tSrc.value = this.bloomH.texture;
    this.mBlurV.uniforms.uDir.value.set(0, 1/bh);
    this._drawQuad(this.mBlurV, this.bloomV);

    this.mFinal.uniforms.tTrail.value = this.trailB.texture;
    this.mFinal.uniforms.tBloom.value = this.bloomV.texture;
    this._drawQuad(this.mFinal, null);
    renderer3D.setRenderTarget(null);
  }
};

// ---------- music render tick ----------
function updateMusic(){
  const list = latest.multiHandLandmarks || [];
  const handed = latest.multiHandedness || [];
  let right = null, left = null;
  for (let i=0;i<list.length;i++){
    const label = handed[i]?.label || (i===0?"Right":"Left");
    if (label === "Right") right = list[i]; else left = list[i];
  }
  const rk = el("opt-key").value;
  const md = el("opt-scale").value;
  const oct = parseInt(el("opt-oct").value, 10);
  const rev = parseFloat(el("opt-rev").value);
  if (reverb) reverb.wet.rampTo(rev, 0.08);
  const notes = melodyNotes(rk, md, oct);

  // melody on right hand : highest extended finger drives note
  if (right){
    const ext = detectExtended(right);
    let chosen = -1;
    for (let i=4;i>=0;i--){ if (ext[i]){ chosen = i; break; } }
    if (chosen >= 0){
      const f = notes[chosen];
      if (MEL_ACTIVE !== chosen){
        if (MEL_ACTIVE !== null) mel.triggerRelease([notes[MEL_ACTIVE]]);
        mel.triggerAttack(f);
        MEL_ACTIVE = chosen;
      }
      const label = midiToName(12*(oct+1) + (KEY_ROOTS[rk]||7) + SCALE_STEPS[md][[0,2,4,5,6][chosen]]);
      el("note-val").textContent = label;
    } else if (MEL_ACTIVE !== null){
      mel.triggerRelease([notes[MEL_ACTIVE]]); MEL_ACTIVE = null;
      el("note-val").textContent = "—";
    }
  } else if (MEL_ACTIVE !== null){
    mel.triggerRelease([notes[MEL_ACTIVE]]); MEL_ACTIVE = null;
    el("note-val").textContent = "—";
  }

  // chord on left hand : number of extended fingers
  if (left){
    const ext = detectExtended(left);
    const n = ext.filter(Boolean).length;
    if (n > 0){
      const c = chordNotes(n, rk, md, oct);
      if (!CHORD_ACTIVE || CHORD_ACTIVE.n !== n){
        if (CHORD_ACTIVE) chord.triggerRelease(CHORD_ACTIVE.notes);
        chord.triggerAttack(c.notes);
        CHORD_ACTIVE = { n, notes: c.notes, symbol: c.symbol };
      }
      el("chord-val").textContent = c.symbol;
    } else if (CHORD_ACTIVE){
      chord.triggerRelease(CHORD_ACTIVE.notes); CHORD_ACTIVE = null;
      el("chord-val").textContent = "—";
    }
  } else if (CHORD_ACTIVE){
    chord.triggerRelease(CHORD_ACTIVE.notes); CHORD_ACTIVE = null;
    el("chord-val").textContent = "—";
  }
}
function stopAllNotes(){
  if (MEL_ACTIVE !== null && mel){ mel.releaseAll(); MEL_ACTIVE = null; }
  if (CHORD_ACTIVE && chord){ chord.releaseAll(); CHORD_ACTIVE = null; }
}

// ---------- main loop ----------
function render(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
  const list = latest.multiHandLandmarks || [];
  const hasHand = list.length > 0;
  el("toast").classList.toggle("on", !hasHand && MODE !== "music");

  if (MODE === "music"){
    threeC.style.display = "none";
    if (AUDIO_READY && !mutedFlag) updateMusic();
  } else if (MODE === "sense"){
    threeC.style.display = "block";
    updateSense(dt, now);
  } else if (MODE === "flux"){
    threeC.style.display = "block";
    if (!FLUX.ready) FLUX.init();
    FLUX.tick(dt, now * 0.001);
    FLUX.render();
  }

  const showBones = el("opt-bones").value === "1";
  drawBones(showBones);
  requestAnimationFrame(render);
}

// ---------- UI ----------
function renderInstrumentRow(){
  const host = el("inst-row"); host.innerHTML = "";
  Object.entries(INSTRUMENTS).forEach(([k, i]) => {
    const b = document.createElement("button");
    b.className = "pill" + (k === INSTR ? " on" : "");
    b.innerHTML = `<div class="emoji">${i.emoji}</div><div>${i.label}</div>`;
    b.addEventListener("click", () => {
      INSTR = k; setInstrument(k);
      host.querySelectorAll(".pill").forEach(p => p.classList.toggle("on", p === b));
    });
    host.appendChild(b);
  });
}
function renderObjectRow(){
  const host = el("obj-row"); host.innerHTML = "";
  OBJECTS.forEach(o => {
    const b = document.createElement("button");
    b.className = "pill lime" + (o.key === OBJ_KEY ? " on" : "");
    b.innerHTML = `<div class="emoji">${o.emoji}</div><div>${o.label}</div>`;
    b.addEventListener("click", () => {
      setObjKey(o.key);
      host.querySelectorAll(".pill").forEach(p => p.classList.toggle("on", p === b));
    });
    host.appendChild(b);
  });
}
function setMode(m){
  MODE = m;
  document.querySelectorAll("#tabs button").forEach(b => {
    const active = b.dataset.mode === m;
    b.classList.toggle("on", active);
    b.classList.toggle("music", active && m === "music");
    b.classList.toggle("sense", active && m === "sense");
    b.classList.toggle("flux",  active && m === "flux");
  });
  el("shelf-music").classList.toggle("hide", m !== "music");
  el("shelf-sense").classList.toggle("hide", m !== "sense");
  el("shelf-flux").classList.toggle("hide", m !== "flux");
  el("fluxbar").classList.toggle("on", m === "flux");
  if (m !== "music") stopAllNotes();
  const cap = el("caption");
  if (m === "music") cap.textContent = "MAIN DROITE = MÉLODIE · MAIN GAUCHE = ACCORD";
  if (m === "sense") cap.textContent = "LÈVE UNE MAIN · POING SAISIT · PAUME OUVERTE JETTE";
  if (m === "flux")  cap.textContent = "DEUX MAINS ATTIRENT · POING RASSEMBLE · PINCEMENT ILLUMINE";
  if (m === "flux" && FLUX.ready) FLUX.resize();
}

// ---------- boot wiring ----------
el("btn-start").addEventListener("click", async () => {
  const b = el("btn-start");
  b.disabled = true; b.textContent = "démarrage…";
  try {
    sizeCanvas();
    await initAudio();
    await initHands();
    initThree();
    renderInstrumentRow();
    renderObjectRow();
    el("boot").classList.add("hide");
    el("hud").classList.remove("hide");
    setMode("music");
    lastT = performance.now();
    requestAnimationFrame(render);
  } catch (e){
    b.disabled = false; b.textContent = "Réessayer";
    alert("Impossible de démarrer :\n" + (e && e.message ? e.message : e));
  }
});

document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
document.querySelectorAll("#fluxbar button").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.fx;
  document.querySelectorAll("#fluxbar button").forEach(x => x.classList.toggle("on", x === b));
  if (FLUX.ready) FLUX.setScene(k);
}));

el("btn-settings").addEventListener("click", () => el("drawer").classList.toggle("open"));
el("drawer-close").addEventListener("click", () => el("drawer").classList.remove("open"));
el("opt-mute").addEventListener("change", (e) => {
  mutedFlag = e.target.value === "1";
  if (master) master.gain.rampTo(mutedFlag ? 0 : 0.9, 0.1);
  if (mutedFlag) stopAllNotes();
});
</script>
