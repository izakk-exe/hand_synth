<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a10"/>
      <stop offset="1" stop-color="#140e22"/>
    </linearGradient>
    <radialGradient id="hot" cx="0.3" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2d7a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff2d7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cold" cx="0.7" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#44e0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#44e0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"  stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff4a9c"/>
      <stop offset="1"  stop-color="#44e0ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <circle cx="500"  cy="240" r="420" fill="url(#hot)"/>
  <circle cx="1150" cy="240" r="420" fill="url(#cold)"/>

  <!-- grid -->
  <g stroke="rgba(255,255,255,.06)" stroke-width="1">
    <path d="M 0 60   L 1600 60" /><path d="M 0 120  L 1600 120" /><path d="M 0 180  L 1600 180" />
    <path d="M 0 240  L 1600 240" /><path d="M 0 300  L 1600 300" /><path d="M 0 360  L 1600 360" />
    <path d="M 0 420  L 1600 420" />
    <path d="M 100 0  L 100 480" /><path d="M 200 0  L 200 480" /><path d="M 300 0  L 300 480" />
    <path d="M 400 0  L 400 480" /><path d="M 500 0  L 500 480" /><path d="M 600 0  L 600 480" />
    <path d="M 700 0  L 700 480" /><path d="M 800 0  L 800 480" /><path d="M 900 0  L 900 480" />
    <path d="M 1000 0 L 1000 480" /><path d="M 1100 0 L 1100 480" /><path d="M 1200 0 L 1200 480" />
    <path d="M 1300 0 L 1300 480" /><path d="M 1400 0 L 1400 480" /><path d="M 1500 0 L 1500 480" />
  </g>

  <!-- hand bones left (stylized) -->
  <g transform="translate(220 240) scale(1.4)" stroke="#00ff5a" stroke-width="3" fill="none">
    <path d="M 0 60 L 10 20 L 20 -10 L 25 -30"/>
    <path d="M 0 60 L -20 40 L -30 10 L -35 -15 L -40 -40"/>
    <path d="M 0 60 L -45 50 L -70 40 L -90 30"/>
    <path d="M 0 60 L -15 50 L -22 20 L -28 -8 L -32 -34"/>
    <path d="M 0 60 L 5  48 L 10  18 L 15 -12 L 20 -38"/>
    <g fill="#ff2d4a">
      <circle cx="0"  cy="60" r="5"/>
      <circle cx="25" cy="-30" r="4"/>
      <circle cx="-40" cy="-40" r="4"/>
      <circle cx="-90" cy="30" r="4"/>
      <circle cx="-32" cy="-34" r="4"/>
      <circle cx="20" cy="-38" r="4"/>
    </g>
  </g>

  <!-- hand bones right (stylized) -->
  <g transform="translate(1380 240) scale(1.4)" stroke="#00ff5a" stroke-width="3" fill="none">
    <path d="M 0 60 L -10 20 L -20 -10 L -25 -30"/>
    <path d="M 0 60 L 20 40 L 30 10 L 35 -15 L 40 -40"/>
    <path d="M 0 60 L 45 50 L 70 40 L 90 30"/>
    <path d="M 0 60 L 15 50 L 22 20 L 28 -8 L 32 -34"/>
    <path d="M 0 60 L -5 48 L -10 18 L -15 -12 L -20 -38"/>
    <g fill="#ff2d4a">
      <circle cx="0"  cy="60" r="5"/>
      <circle cx="-25" cy="-30" r="4"/>
      <circle cx="40" cy="-40" r="4"/>
      <circle cx="90" cy="30" r="4"/>
      <circle cx="32" cy="-34" r="4"/>
      <circle cx="-20" cy="-38" r="4"/>
    </g>
  </g>

  <!-- central wireframe orb between hands -->
  <g transform="translate(800 240)">
    <circle r="90"  fill="rgba(68,224,255,0.14)" stroke="#44e0ff" stroke-width="1.5"/>
    <circle r="90"  fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <!-- latitude/longitude -->
    <ellipse rx="90" ry="30" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <ellipse rx="90" ry="55" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <ellipse rx="90" ry="80" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <ellipse rx="30" ry="90" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <ellipse rx="55" ry="90" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <ellipse rx="80" ry="90" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <circle r="4" fill="#fff"/>
  </g>

  <!-- connecting wave between hands and orb -->
  <path d="M 300 240 Q 500 200 700 240 Q 800 260 900 240 Q 1100 200 1300 240"
        fill="none" stroke="#ffd166" stroke-width="2" opacity="0.6"/>

  <!-- wordmark -->
  <g>
    <text x="800" y="440" text-anchor="middle"
          font-family="-apple-system,Segoe UI,sans-serif"
          font-size="56" font-weight="800"
          letter-spacing="12"
          fill="url(#word)">PALMA</text>
  </g>
</svg>
