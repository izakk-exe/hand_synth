<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a22"/>
      <stop offset="1" stop-color="#0a0a10"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg3)"/>

  <!-- 4 feature pills -->
  <g font-family="-apple-system,Segoe UI,sans-serif" fill="#f4f4f6">

    <!-- hands-only -->
    <g transform="translate(80 100)">
      <rect width="240" height="200" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(68,224,255,.4)" stroke-width="1.5"/>
      <g transform="translate(120 60)">
        <circle r="34" fill="rgba(68,224,255,0.1)" stroke="#44e0ff" stroke-width="2"/>
        <text y="10" text-anchor="middle" font-size="30">✋</text>
      </g>
      <text x="120" y="140" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2">HANDS ONLY</text>
      <text x="120" y="165" text-anchor="middle" font-size="11" fill="#8b8b96">no touch, no keyboard, no mouse required</text>
    </g>

    <!-- customizable -->
    <g transform="translate(360 100)">
      <rect width="240" height="200" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,45,122,.4)" stroke-width="1.5"/>
      <g transform="translate(120 60)">
        <circle r="34" fill="rgba(255,45,122,0.1)" stroke="#ff2d7a" stroke-width="2"/>
        <text y="10" text-anchor="middle" font-size="26">⚙</text>
      </g>
      <text x="120" y="140" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2">ADJUSTABLE</text>
      <text x="120" y="165" text-anchor="middle" font-size="11" fill="#8b8b96">gesture sensitivity, speed, scale,</text>
      <text x="120" y="180" text-anchor="middle" font-size="11" fill="#8b8b96">volume all tunable per user</text>
    </g>

    <!-- offline -->
    <g transform="translate(640 100)">
      <rect width="240" height="200" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(156,255,107,.4)" stroke-width="1.5"/>
      <g transform="translate(120 60)">
        <circle r="34" fill="rgba(156,255,107,0.1)" stroke="#9cff6b" stroke-width="2"/>
        <text y="10" text-anchor="middle" font-size="28">◉</text>
      </g>
      <text x="120" y="140" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2">PRIVATE &amp; OFFLINE</text>
      <text x="120" y="165" text-anchor="middle" font-size="11" fill="#8b8b96">no account, no cloud,</text>
      <text x="120" y="180" text-anchor="middle" font-size="11" fill="#8b8b96">no data leaves the device</text>
    </g>

    <!-- expressive -->
    <g transform="translate(920 100)">
      <rect width="200" height="200" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,209,102,.4)" stroke-width="1.5"/>
      <g transform="translate(100 60)">
        <circle r="34" fill="rgba(255,209,102,0.1)" stroke="#ffd166" stroke-width="2"/>
        <text y="10" text-anchor="middle" font-size="28">♪</text>
      </g>
      <text x="100" y="140" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2">EXPRESSIVE</text>
      <text x="100" y="165" text-anchor="middle" font-size="11" fill="#8b8b96">music + visual art</text>
      <text x="100" y="180" text-anchor="middle" font-size="11" fill="#8b8b96">with any range of motion</text>
    </g>
  </g>

  <text x="600" y="40" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif"
        font-size="12" letter-spacing="4" fill="#8b8b96">BUILT FOR ACCESSIBLE EXPRESSION</text>
</svg>
